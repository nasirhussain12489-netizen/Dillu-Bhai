<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="55%" stop-color="#dc0000" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333333" />
      <stop offset="50%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
  </defs>

  <!-- 3D Faceted Red Star at Top Right -->
  <g transform="translate(375, 62)">
    <polygon points="0,-46 11,-14 45,-14 18,7 28,40 0,20 -28,40 -18,7 -45,-14 -11,-14" fill="url(#redGrad)" />
    <polygon points="0,-46 11,-14 0,2" fill="#ff4d4d" />
    <polygon points="0,2 45,-14 18,7" fill="#b30000" />
    <polygon points="0,2 28,40 0,20" fill="#900000" />
    <polygon points="0,2 -28,40 -18,7" fill="#cc0000" />
    <polygon points="0,2 -45,-14 -11,-14" fill="#ff3333" />
  </g>

  <!-- Black Graduation Cap (Mortarboard) -->
  <polygon points="152,130 226,72 322,72 282,115" fill="url(#darkGrad)" />
  <path d="M 197 115 C 220 93, 265 89, 283 99 L 291 117 C 262 110, 224 118, 206 142 Z" fill="url(#darkGrad)" />

  <!-- Red Tassel Hanging Left -->
  <rect x="162" y="128" width="4" height="25" fill="#d60000" />
  <circle cx="164" cy="155" r="6" fill="#d60000" />
  <path d="M 160 160 L 155 196 L 161 195 L 164 197 L 167 195 L 173 196 L 168 160 Z" fill="url(#redGrad)" />

  <!-- Graduate Head Silhouette -->
  <ellipse cx="250" cy="150" rx="35" ry="30" transform="rotate(-18 250 150)" fill="url(#darkGrad)" />

  <!-- Outer Left Black Shoulder / Crescent Curve -->
  <path d="M 124 352 C 95 255, 152 176, 286 177 C 218 205, 140 258, 124 352 Z" fill="url(#darkGrad)" />

  <!-- Inner Black 'G' C-Curve -->
  <path d="M 222 250 C 190 305, 212 385, 290 385 C 304 385, 315 378, 315 368 L 315 403 C 282 418, 200 412, 180 342 C 165 290, 195 258, 222 250 Z" fill="url(#darkGrad)" />

  <!-- Sweeping Red Ribbon from Bottom-Left of G up to the Star -->
  <path d="M 218 402 C 138 388, 120 315, 165 255 C 212 195, 332 155, 374 78 C 362 162, 282 212, 218 265 C 168 308, 172 372, 218 402 Z" fill="url(#redGrad)" />

  <!-- Red Upper Right Terminal of G -->
  <path d="M 284 228 L 328 195 L 377 212 L 352 256 C 334 234, 312 226, 284 228 Z" fill="url(#redGrad)" />

  <!-- Red Right Horizontal Bar & Vertical Stem of G -->
  <path d="M 264 312 C 280 292, 305 285, 338 285 L 390 285 C 378 290, 375 296, 375 308 L 375 358 L 315 388 L 315 312 C 315 303, 292 301, 264 312 Z" fill="url(#redGrad)" />

  <!-- Open Book Pages - Left Red Upper Pages -->
  <path d="M 88 370 C 155 370, 215 398, 246 456 C 206 414, 152 396, 94 393 Z" fill="url(#redGrad)" />
  <path d="M 68 401 C 142 398, 208 420, 246 458 C 198 428, 140 418, 78 422 Z" fill="url(#redGrad)" />

  <!-- Open Book Pages - Right Red Upper Pages -->
  <path d="M 415 370 C 348 370, 288 398, 254 456 C 294 414, 348 396, 408 393 Z" fill="url(#redGrad)" />
  <path d="M 434 401 C 360 398, 294 420, 254 458 C 302 428, 360 418, 424 422 Z" fill="url(#redGrad)" />

  <!-- Open Book Pages - Bottom Black Base Curve -->
  <path d="M 47 434 C 132 414, 206 435, 250 472 C 294 435, 368 414, 453 434 L 433 460 C 358 442, 292 456, 250 484 C 208 456, 142 442, 67 460 Z" fill="url(#darkGrad)" />
</svg>
